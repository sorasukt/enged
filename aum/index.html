<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกงบประมาณโครงการ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f9fafb; }
        /* ป้องกันการตัดคำและแสดงข้อความให้ครบถ้วน */
        label, span, div, p { 
            white-space: normal; 
            word-wrap: break-word; 
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="p-6 min-h-screen flex items-center justify-center">

    <div class="max-w-2xl w-full bg-white rounded-lg shadow-sm border border-gray-200 p-8">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6 border-b pb-4">บันทึกรายการใช้จ่ายโครงการ</h2>
        
        <form id="budgetForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">วันที่ทำรายการ</label>
                <input type="date" id="date" required class="w-full border border-gray-300 rounded-md p-2.5 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">หมวดเงิน (ให้ตรงกับรายการสรุป)</label>
                <select id="category" required class="w-full border border-gray-300 rounded-md p-2.5 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white">
                    <option value="" disabled selected>เลือกหมวดเงิน...</option>
                    <option value="- ค่าจ้างชั่วคราว">- ค่าจ้างชั่วคราว (งบบุคลากร)</option>
                    <option value="- ค่าตอบแทน">- ค่าตอบแทน (งบดำเนินงาน)</option>
                    <option value="- ค่าใช้สอย">- ค่าใช้สอย (งบดำเนินงาน)</option>
                    <option value="-ค่าวัสดุ">- ค่าวัสดุ (งบดำเนินงาน)</option>
                    <option value="-ค่าสาธารณูปโภค">- ค่าสาธารณูปโภค (งบดำเนินงาน)</option>
                    <option value="-ค่าครุภัณฑ์">- ค่าครุภัณฑ์ (งบลงทุน)</option>
                    <option value="-ที่ดิน , สิ่งก่อสร้าง">- ที่ดิน , สิ่งก่อสร้าง (งบลงทุน)</option>
                    <option value="งบเงินอุดหนุน">งบเงินอุดหนุน</option>
                    <option value="งบรายจ่ายอื่นๆ">งบรายจ่ายอื่นๆ</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">รายการ/รายละเอียด</label>
                <input type="text" id="details" required class="w-full border border-gray-300 rounded-md p-2.5 outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">จำนวนหน่วย</label>
                    <input type="number" id="qty" min="1" required class="w-full border border-gray-300 rounded-md p-2.5 outline-none focus:ring-blue-500 focus:border-blue-500" oninput="calculateTotal()">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ราคาต่อหน่วย (บาท)</label>
                    <input type="number" step="0.01" id="price" required class="w-full border border-gray-300 rounded-md p-2.5 outline-none focus:ring-blue-500 focus:border-blue-500" oninput="calculateTotal()">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">จำนวนเงินรวม (บาท)</label>
                <input type="text" id="total" readonly class="w-full border border-gray-100 bg-gray-50 rounded-md p-2.5 text-gray-600 font-semibold outline-none cursor-not-allowed">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">หมายเหตุ</label>
                <textarea id="note" rows="2" class="w-full border border-gray-300 rounded-md p-2.5 outline-none focus:ring-blue-500 focus:border-blue-500"></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ภาพหลักฐาน (Photo, PDF)</label>
                <input type="file" id="file" accept="image/*,.pdf" class="w-full border border-gray-300 rounded-md p-2 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-medium py-3 px-4 rounded-md hover:bg-blue-700 transition-colors focus:ring-4 focus:ring-blue-200 mt-4">
                บันทึกข้อมูล
            </button>
            <p id="statusMessage" class="text-center text-sm mt-3 hidden"></p>
        </form>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbynESsU9hxZ-MfZo2hSodAb7KsYvoWhhfLJnUcR_X5Qpmkxx5VQlmKUg1dNQbrAmtcN/exec'; // วาง URL จาก Google Apps Script ที่นี่

        function calculateTotal() {
            const qty = document.getElementById('qty').value;
            const price = document.getElementById('price').value;
            if (qty && price) {
                document.getElementById('total').value = (qty * price).toLocaleString('th-TH', {minimumFractionDigits: 2});
            } else {
                document.getElementById('total').value = '';
            }
        }

        document.getElementById('budgetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMessage');
            
            btn.disabled = true;
            btn.innerHTML = 'กำลังบันทึกข้อมูล...';
            statusMsg.classList.add('hidden');

            const fileInput = document.getElementById('file');
            let fileBase64 = null;
            let fileName = null;
            let fileMimeType = null;

            // แปลงไฟล์เป็น Base64 ถ้ามีการแนบไฟล์
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                fileName = file.name;
                fileMimeType = file.type;
                fileBase64 = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }

            const payload = {
                date: document.getElementById('date').value,
                category: document.getElementById('category').value,
                details: document.getElementById('details').value,
                qty: document.getElementById('qty').value,
                price: document.getElementById('price').value,
                note: document.getElementById('note').value,
                fileName: fileName,
                fileMimeType: fileMimeType,
                fileBase64: fileBase64
            };

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    statusMsg.textContent = 'บันทึกข้อมูลและอัปโหลดไฟล์สำเร็จ!';
                    statusMsg.className = 'text-center text-sm mt-3 text-green-600 block';
                    document.getElementById('budgetForm').reset();
                    document.getElementById('total').value = '';
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                statusMsg.textContent = 'เกิดข้อผิดพลาด: ' + error.message;
                statusMsg.className = 'text-center text-sm mt-3 text-red-600 block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'บันทึกข้อมูล';
            }
        });
    </script>
</body>
</html>
