<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ระบบบันทึกงบประมาณโครงการ</title>

    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Noto Sans Thai', sans-serif;
        }

        body {
            background:
                radial-gradient(circle at top left, rgba(59,130,246,0.08), transparent 30%),
                radial-gradient(circle at bottom right, rgba(99,102,241,0.08), transparent 30%),
                #f5f7fb;
        }

        .glass-card {
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .input-style {
            @apply w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-gray-800 outline-none transition-all duration-200;
        }

        .input-style:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59,130,246,0.10);
        }

        input[type="file"]::file-selector-button {
            border: 0;
            padding: 10px 16px;
            border-radius: 10px;
            background: #eff6ff;
            color: #2563eb;
            font-weight: 600;
            margin-right: 14px;
            cursor: pointer;
            transition: .2s;
        }

        input[type="file"]::file-selector-button:hover {
            background: #dbeafe;
        }

        .fade-in {
            animation: fade .4s ease;
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="min-h-screen px-4 py-10 md:px-6">

    <div class="mx-auto max-w-3xl fade-in">

        <!-- Header -->
        <div class="mb-6">
            <div class="inline-flex items-center gap-2 rounded-full border border-blue-100 bg-blue-50 px-4 py-1.5 text-sm font-medium text-blue-700">
                ระบบบริหารงบประมาณ
            </div>

            <h1 class="mt-4 text-3xl font-bold tracking-tight text-gray-900 md:text-4xl">
                บันทึกรายการใช้จ่ายโครงการ
            </h1>

            <p class="mt-2 text-sm leading-relaxed text-gray-500">
                สำหรับจัดเก็บข้อมูลค่าใช้จ่าย เอกสารแนบ และหลักฐานประกอบโครงการอย่างเป็นระบบ
            </p>
        </div>

        <!-- Card -->
        <div class="glass-card rounded-3xl border border-white/60 shadow-[0_10px_40px_rgba(15,23,42,0.08)]">

            <form id="budgetForm" class="space-y-7 p-6 md:p-8">

                <!-- วันที่ -->
                <div>
                    <label class="mb-2 block text-sm font-semibold text-gray-700">
                        วันที่ทำรายการ
                    </label>

                    <input
                        type="date"
                        id="date"
                        required
                        class="input-style"
                    />
                </div>

                <!-- หมวดเงิน -->
                <div>
                    <label class="mb-2 block text-sm font-semibold text-gray-700">
                        หมวดเงิน
                    </label>

                    <select
                        id="category"
                        required
                        class="input-style"
                    >
                        <option value="" disabled selected>
                            กรุณาเลือกหมวดเงิน
                        </option>

                        <option value="- ค่าจ้างชั่วคราว">
                            - ค่าจ้างชั่วคราว (งบบุคลากร)
                        </option>

                        <option value="- ค่าตอบแทน">
                            - ค่าตอบแทน (งบดำเนินงาน)
                        </option>

                        <option value="- ค่าใช้สอย">
                            - ค่าใช้สอย (งบดำเนินงาน)
                        </option>

                        <option value="- ค่าวัสดุ">
                            - ค่าวัสดุ (งบดำเนินงาน)
                        </option>

                        <option value="- ค่าสาธารณูปโภค">
                            - ค่าสาธารณูปโภค (งบดำเนินงาน)
                        </option>

                        <option value="- ค่าครุภัณฑ์">
                            - ค่าครุภัณฑ์ (งบลงทุน)
                        </option>

                        <option value="- ที่ดิน , สิ่งก่อสร้าง">
                            - ที่ดิน , สิ่งก่อสร้าง (งบลงทุน)
                        </option>

                        <option value="งบเงินอุดหนุน">
                            งบเงินอุดหนุน
                        </option>

                        <option value="งบรายจ่ายอื่นๆ">
                            งบรายจ่ายอื่นๆ
                        </option>
                    </select>
                </div>

                <!-- รายละเอียด -->
                <div>
                    <label class="mb-2 block text-sm font-semibold text-gray-700">
                        รายการ / รายละเอียด
                    </label>

                    <input
                        type="text"
                        id="details"
                        required
                        placeholder="เช่น ค่าอุปกรณ์ประกอบกิจกรรม"
                        class="input-style"
                    />
                </div>

                <!-- จำนวน -->
                <div class="grid grid-cols-1 gap-5 md:grid-cols-2">

                    <div>
                        <label class="mb-2 block text-sm font-semibold text-gray-700">
                            จำนวนหน่วย
                        </label>

                        <input
                            type="number"
                            id="qty"
                            min="1"
                            required
                            placeholder="0"
                            class="input-style"
                            oninput="calculateTotal()"
                        />
                    </div>

                    <div>
                        <label class="mb-2 block text-sm font-semibold text-gray-700">
                            ราคาต่อหน่วย (บาท)
                        </label>

                        <input
                            type="number"
                            id="price"
                            step="0.01"
                            required
                            placeholder="0.00"
                            class="input-style"
                            oninput="calculateTotal()"
                        />
                    </div>

                </div>

                <!-- รวม -->
                <div>
                    <label class="mb-2 block text-sm font-semibold text-gray-700">
                        จำนวนเงินรวม
                    </label>

                    <div class="relative">

                        <input
                            type="text"
                            id="total"
                            readonly
                            placeholder="0.00"
                            class="input-style bg-gray-50 pr-16 font-semibold text-blue-700"
                        />

                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-sm font-medium text-gray-400">
                            บาท
                        </span>
                    </div>
                </div>

                <!-- หมายเหตุ -->
                <div>
                    <label class="mb-2 block text-sm font-semibold text-gray-700">
                        หมายเหตุเพิ่มเติม
                    </label>

                    <textarea
                        id="note"
                        rows="3"
                        placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)"
                        class="input-style resize-none"
                    ></textarea>
                </div>

                <!-- ไฟล์ -->
                <div>
                    <label class="mb-2 block text-sm font-semibold text-gray-700">
                        แนบไฟล์หลักฐาน
                    </label>

                    <div class="rounded-2xl border border-dashed border-gray-300 bg-gray-50/70 p-5">
                        <input
                            type="file"
                            id="file"
                            accept="image/*,.pdf"
                            class="w-full text-sm text-gray-600"
                        />

                        <p class="mt-3 text-xs text-gray-400">
                            รองรับไฟล์รูปภาพ และ PDF
                        </p>
                    </div>
                </div>

                <!-- Button -->
                <div class="pt-2">

                    <button
                        type="submit"
                        id="submitBtn"
                        class="w-full rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 px-5 py-3.5 text-sm font-semibold text-white shadow-lg shadow-blue-200 transition-all duration-200 hover:-translate-y-0.5 hover:shadow-xl disabled:cursor-not-allowed disabled:opacity-70"
                    >
                        บันทึกข้อมูล
                    </button>

                    <p
                        id="statusMessage"
                        class="mt-4 hidden text-center text-sm font-medium"
                    ></p>
                </div>

            </form>
        </div>
    </div>

    <script>
        const WEB_APP_URL =
            'https://script.google.com/macros/s/AKfycbynESsU9hxZ-MfZo2hSodAb7KsYvoWhhfLJnUcR_X5Qpmkxx5VQlmKUg1dNQbrAmtcN/exec';

        function calculateTotal() {
            const qty = parseFloat(document.getElementById('qty').value) || 0;
            const price = parseFloat(document.getElementById('price').value) || 0;

            const total = qty * price;

            document.getElementById('total').value =
                total > 0
                    ? total.toLocaleString('th-TH', {
                          minimumFractionDigits: 2,
                          maximumFractionDigits: 2
                      })
                    : '';
        }

        document
            .getElementById('budgetForm')
            .addEventListener('submit', async (e) => {

                e.preventDefault();

                const btn = document.getElementById('submitBtn');
                const statusMsg = document.getElementById('statusMessage');

                btn.disabled = true;
                btn.innerHTML = 'กำลังบันทึกข้อมูล...';

                statusMsg.classList.add('hidden');

                const fileInput = document.getElementById('file');

                let fileBase64 = null;
                let fileName = null;
                let fileMimeType = null;

                if (fileInput.files.length > 0) {

                    const file = fileInput.files[0];

                    fileName = file.name;
                    fileMimeType = file.type;

                    fileBase64 = await new Promise((resolve) => {

                        const reader = new FileReader();

                        reader.onload = (e) => resolve(e.target.result);

                        reader.readAsDataURL(file);
                    });
                }

                const payload = {
                    date: document.getElementById('date').value,
                    category: document.getElementById('category').value,
                    details: document.getElementById('details').value,
                    qty: document.getElementById('qty').value,
                    price: document.getElementById('price').value,
                    note: document.getElementById('note').value,
                    fileName,
                    fileMimeType,
                    fileBase64
                };

                try {

                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();

                    if (result.status === 'success') {

                        statusMsg.textContent =
                            'บันทึกข้อมูลและอัปโหลดไฟล์สำเร็จ';

                        statusMsg.className =
                            'mt-4 block text-center text-sm font-medium text-green-600';

                        document.getElementById('budgetForm').reset();

                        document.getElementById('total').value = '';

                    } else {

                        throw new Error(result.message);
                    }

                } catch (error) {

                    statusMsg.textContent =
                        'เกิดข้อผิดพลาด : ' + error.message;

                    statusMsg.className =
                        'mt-4 block text-center text-sm font-medium text-red-600';

                } finally {

                    btn.disabled = false;
                    btn.innerHTML = 'บันทึกข้อมูล';
                }
            });
    </script>
</body>
</html>
